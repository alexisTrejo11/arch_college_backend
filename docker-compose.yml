services:

  # ╔══════════════════════════════════════════════╗
  # ║            INFRASTRUCTURE                    ║
  # ╚══════════════════════════════════════════════╝

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  # ╔══════════════════════════════════════════════╗
  # ║          PLATFORM  SERVICES                  ║
  # ╚══════════════════════════════════════════════╝

  config-server:
    build:
      context: .
      args:
        SERVICE_NAME: config-server
    volumes:
      - ./config-data:/app/config-data:ro
    environment:
      CONFIG_PATH: /app
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  eureka-server:
    build:
      context: .
      args:
        SERVICE_NAME: eureka-server
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  admin-service:
    build:
      context: .
      args:
        SERVICE_NAME: admin-service
    environment:
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy

  # ╔══════════════════════════════════════════════╗
  # ║          BUSINESS  SERVICES                  ║
  # ╚══════════════════════════════════════════════╝

  account-service:
    build:
      context: .
      args:
        SERVICE_NAME: account-service
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: account-service
      SERVER_PORT: 8082
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
      # Swagger
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PATHS_TO_MATCH: /**
      SPRINGDOC_PACKAGES_TO_SCAN: io.github.alexistrejo11.architecture.college.account
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-256-bit-key}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  student-service:
    build:
      context: .
      args:
        SERVICE_NAME: student-service
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: student-service
      SPRING_PROFILES_ACTIVE: default
      SERVER_PORT: 8083
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
      # Swagger
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PATHS_TO_MATCH: /**
      SPRINGDOC_PACKAGES_TO_SCAN: io.github.alexistrejo11.architecture.college.student
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  teacher-service:
    build:
      context: .
      args:
        SERVICE_NAME: teacher-service
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: teacher-service
      SERVER_PORT: 8084
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teacher_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
      # Swagger
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PATHS_TO_MATCH: /**
      SPRINGDOC_PACKAGES_TO_SCAN: io.github.alexistrejo11.architecture.college.teacher
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-256-bit-key}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  curriculum-service:
    build:
      context: .
      args:
        SERVICE_NAME: curriculum-service
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: curriculum-service
      SERVER_PORT: 8085
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curriculum_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Eureka — curriculum config uses EUREKA_DEFAULT_ZONE
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  schedule-service:
    build:
      context: .
      args:
        SERVICE_NAME: schedule-service
    ports:
      - "8086:8086"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: schedule-service
      SERVER_PORT: 8086
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schedule_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
      # Swagger
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PATHS_TO_MATCH: /**
      SPRINGDOC_PACKAGES_TO_SCAN: io.github.alexistrejo11.architecture.college.schedule
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      args:
        SERVICE_NAME: enrollment-service
    ports:
      - "8087:8087"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: enrollment-service
      SERVER_PORT: 8087
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enrollment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/enrollment_db
      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
      # Swagger
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PATHS_TO_MATCH: /**
      SPRINGDOC_PACKAGES_TO_SCAN: io.github.alexistrejo11.architecture.college.enrollment
      # Logging
      LOGGING_LEVEL_SPRING_DATA_MONGODB_CORE: WARN
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  grade-service:
    build:
      context: .
      args:
        SERVICE_NAME: grade-service
    ports:
      - "8088:8088"
    environment:
      SPRING_CONFIG_URI: http://config-server:8888
      SPRING_APPLICATION_NAME: grade-service
      SERVER_PORT: 8088
      # Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grade_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/grade_db
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Eureka
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka-server:8761/eureka
      # Admin
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-service:8081
      # Swagger
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_PATHS_TO_MATCH: /**
      SPRINGDOC_PACKAGES_TO_SCAN: io.github.alexistrejo11.architecture.college.grade
      # Logging
      LOGGING_LEVEL_NETFLIX_DISCOVERY: WARN
      LOGGING_LEVEL_NETFLIX_EUREKA: WARN
      LOGGING_LEVEL_MONGODB_DRIVER: WARN
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
