spring:
  datasource:
    url: jdbc:h2:mem:scheduletest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude: org.springframework.cloud.netflix.eureka.server.EurekaServerAutoConfiguration
  boot:
    admin:
      client:
        enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret:
    key: test-secret-key-must-be-at-least-256-bits-for-hs256-testing-purposes-only
