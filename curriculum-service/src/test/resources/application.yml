spring:
  application:
    name: academic_curriculum-service
  datasource:
    url: jdbc:h2:mem:curriculumtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  boot:
    admin:
      client:
        enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret:
    key: test-secret-key-must-be-at-least-256-bits-for-hs256-testing-purposes-only

management:
  endpoints:
    web:
      exposure:
        include: health,info
