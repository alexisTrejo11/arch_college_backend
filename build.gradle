plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.6'
}

allprojects {
	group = 'at.backend.drugstore'
	version = '1.0.0'

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3"
		}
	}

	// Apply common configurations
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}
}

// Disable bootJar for the shared library only (services need bootJar to produce runnable fat JARs)
configure(subprojects.findAll { it.name == 'common-classes' }) {
	tasks.named('bootJar').configure {
		enabled = false
	}

	tasks.named('jar').configure {
		enabled = true
	}
}
